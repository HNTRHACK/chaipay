<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E4D3B">
  <title>ChaiPay</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M6 11h17v8a7 7 0 0 1-7 7h-3a7 7 0 0 1-7-7z%22 fill=%22%231E4D3B%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <dialog id="scanner" aria-label="Scan a UPI QR">
    <div class="scan-wrap">
      <video id="video" playsinline muted></video>
      <div class="scan-frame" aria-hidden="true"></div>
      <p class="scan-hint">Point at any UPI QR</p>
    </div>
    <form id="manual" class="manual">
      <label for="manual-input">No camera? Paste the UPI link</label>
      <input id="manual-input" placeholder="upi://pay?pa=…" autocomplete="off">
      <div class="row">
        <button type="button" class="btn ghost" id="scan-close">Cancel</button>
        <button type="submit" class="btn">Use link</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
