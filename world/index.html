<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#5FC2BC">
  <title>Chai Nagar</title>
  <meta name="description" content="A tiny planet where every street stall takes USDT and the shop gets rupees over UPI.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%235FC2BC%22/%3E%3Cpath d=%22M9 12h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z%22 fill=%22%23F2F3EA%22 stroke=%22%231F2B2B%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="scene" aria-label="Chai Nagar, a tiny 3D town"></canvas>

  <!-- Loading: a hand-drawn chai glass with curling steam -->
  <div id="loading" role="status">
    <svg viewBox="0 0 80 90" width="84" height="94" aria-hidden="true">
      <g fill="none" stroke="#1F2B2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path class="steam s1" d="M30 30 C26 24 34 20 30 13"/>
        <path class="steam s2" d="M40 30 C36 23 44 19 40 10"/>
        <path class="steam s3" d="M50 30 C46 24 54 20 50 13"/>
        <path d="M21 37 L25.5 79 Q26 82 29 82 L51 82 Q54 82 54.5 79 L59 37.5"/>
        <path d="M20.5 37 Q40 40.5 59.5 37.5"/>
        <path d="M24 52 Q40 55 57 52" stroke-width="1.6"/>
      </g>
    </svg>
    <p>LOADING</p>
  </div>

  <!-- Title -->
  <div id="title" hidden>
    <button id="start" type="button">START</button>
    <p class="title-sub">Walk around. Buy chai. Pay in USDT. The shop gets rupees.</p>
  </div>

  <!-- HUD -->
  <div id="hud" hidden>
    <p id="hud-inr">₹ …</p>
    <p id="hud-usdt"></p>
  </div>
  <button id="feed-btn" type="button" hidden aria-controls="feed">Onchain <span id="feed-count"></span></button>
  <aside id="feed" hidden aria-label="Onchain activity">
    <header><h2>Envelopes</h2><button id="feed-close" type="button" aria-label="Close">×</button></header>
    <ul id="feed-list"><li class="f-empty">No envelopes yet. Buy something from a stall.</li></ul>
  </aside>

  <p id="hint" hidden></p>
  <p id="toast" hidden role="status"></p>

  <!-- Dialogue -->
  <section id="dialogue" hidden aria-live="polite">
    <div id="dlg-name"></div>
    <div class="dlg-panel">
      <p id="dlg-text"></p>
      <div id="dlg-extra"></div>
      <div id="dlg-choices"></div>
    </div>
    <button id="dlg-next" type="button" aria-label="Next" hidden><svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 4 L20 12 L7 20 Z" fill="#5AA9E2" stroke="#1F2B2B" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  </section>

  <!-- Mobile controls -->
  <div id="joy" hidden><div id="joy-knob"></div></div>
  <button id="talk" type="button" hidden>Talk</button>

  <noscript>Chai Nagar needs JavaScript and WebGL.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
